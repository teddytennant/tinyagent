name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pytest ruff
      - name: line count
        run: python sz.py
      - name: lint
        run: ruff check .
      - name: tests
        run: PYTHONPATH=. python -m pytest test/ -q
